<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>공지 모음 수집기</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <div class="logo"><img class="logo-mark" src="icons/logo.svg" alt="">공지 모음 수집기</div>
  </header>

  <!-- 로그인 (로그인 안 되어 있을 때만 보임, 나머지 칸은 숨김) -->
  <section class="block hidden" id="login-block">
    <div class="label">로그인</div>
    <p class="hint">웹사이트와 같은 계정으로 한 번 로그인하면 유지됩니다.</p>
    <form id="login-form" class="add-form">
      <label class="field"><span>이메일</span><input id="login-email" type="email" required></label>
      <label class="field"><span>비밀번호</span><input id="login-password" type="password" required></label>
      <button class="btn btn-primary btn-block" type="submit">로그인</button>
    </form>
    <p id="login-error" class="error hidden"></p>
  </section>

  <div id="main-blocks">
  <!-- 수집 -->
  <section class="block">
    <div class="row">
      <div>
        <div class="label">마지막 수집</div>
        <div id="last-collect" class="value">불러오는 중...</div>
        <div id="next-collect" class="next"></div>
      </div>
      <button id="collect-now" class="btn btn-primary">지금 수집</button>
    </div>
  </section>

  <!-- 최근 결과 (접기 가능) -->
  <section class="block fold hidden" id="result-block" data-fold="result">
    <button class="fold-head" type="button"><span class="label">최근 결과</span><span class="fold-icon">▼</span></button>
    <div class="fold-body">
      <p id="collect-state" class="hint"></p>
      <ul id="collect-list" class="list"></ul>
    </div>
  </section>

  <!-- 게시판 추가 -->
  <section class="block">
    <button id="add-board" class="btn btn-block" disabled>이 페이지를 게시판으로 추가</button>
    <div id="add-form" class="add-form hidden">
      <label class="field"><span>폴더</span><select id="add-folder"></select></label>
      <label class="field"><span>게시판 이름</span><input id="add-name" type="text" maxlength="30"></label>
      <!-- 키워드: 비우면 모든 새 공지, 적으면 제목에 하나라도 들어간 공지만 저장 (쉼표로 구분) -->
      <label class="field"><span>키워드 (선택)</span><input id="add-keywords" type="text" placeholder="예: 장학금, 공모전"></label>
      <button id="add-start" class="btn btn-primary btn-block">제목 고르기 시작</button>
    </div>
    <p id="add-error" class="error hidden"></p>
  </section>

  <!-- 확인 필요 게시판 (로그인 풀림, 사이트 변경 등) -->
  <section class="block fold" id="check-block" data-fold="check">
    <button class="fold-head" type="button"><span class="label">확인 필요 게시판 <span id="check-count" class="count warn-count"></span></span><span class="fold-icon">▼</span></button>
    <div class="fold-body">
      <p class="hint">누르면 게시판을 엽니다. 로그인 화면이 나오면 로그인하십시오. 목록이 보이면 자동으로 수집합니다.</p>
      <ul id="check-list" class="list"></ul>
    </div>
  </section>

  <!-- 규칙 미설정 게시판 -->
  <section class="block fold" data-fold="norule">
    <button class="fold-head" type="button"><span class="label">규칙 미설정 게시판 <span id="norule-count" class="count"></span></span><span class="fold-icon">▼</span></button>
    <div class="fold-body">
      <p class="hint">누르면 게시판을 열고 제목 고르기를 시작합니다.</p>
      <ul id="norule-list" class="list"></ul>
    </div>
  </section>

  <!-- 옛 공지 가져오기 (게시판 하나씩, 접기 가능, 항상 맨 아래) -->
  <section class="block fold" data-fold="old">
    <button class="fold-head" type="button"><span class="label">옛 공지 가져오기</span><span class="fold-icon">▼</span></button>
    <div class="fold-body">
      <p class="hint">새로 추가한 게시판은 저장하자마자 아래 페이지 수만큼 자동으로 가져옵니다. 이미 있는 게시판은 골라서 가져옵니다.</p>
      <select id="old-site" class="full-select"></select>
      <div class="pages-row">
        <label class="pages-label">읽을 페이지
          <select id="first-pages">
            <option value="1">1</option><option value="3">3</option><option value="5">5</option><option value="10">10</option>
          </select>
        </label>
        <button id="collect-old" class="btn btn-small">가져오기</button>
      </div>
    </div>
  </section>

  <footer class="foot">
    <button id="open-website" class="btn btn-block">웹사이트 열기</button>
    <button id="logout" class="link-btn">로그아웃</button>
  </footer>
  </div>

  <!-- 팝업은 일반 웹페이지처럼 script 태그로 불러옵니다 (확장 폴더 안의 파일만 가능) -->
  <script src="supabase.js"></script>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
