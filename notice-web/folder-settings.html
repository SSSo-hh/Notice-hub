<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>폴더 설정 | 공지 모음</title>
  <!-- 탭과 즐겨찾기에 보이는 아이콘 -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <a href="index.html" class="logo"><img class="logo-mark" src="favicon.svg" alt="">공지 모음</a>
    <a href="index.html" class="text-btn">공지 화면으로</a>
  </header>

  <main class="settings">
    <div class="settings-head">
      <h1>폴더 설정</h1>
    </div>

    <p class="help">
      왼쪽 줄 모양 손잡이를 끌어서 순서를 바꾸고, 이름은 바로 고칠 수 있습니다.<br>
      폴더를 삭제하면 그 폴더에 등록된 사이트와 공지도 함께 삭제됩니다.
    </p>

    <div class="site-table">
      <div class="row row-head folder-row">
        <span>순서</span>
        <span>폴더 이름</span>
        <span>사이트 수</span>
        <span></span>
      </div>
      <div id="folder-rows"></div>
    </div>

    <button id="add-folder-row" class="add-row">+ 폴더 추가</button>
  </main>

  <!-- Supabase 라이브러리 (인터넷에서 불러옴) 와 접속 설정 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="demo.js"></script> <!-- 로그인하지 않았을 때 쓰는 체험용 예시 데이터 -->
  <script src="supabase-config.js"></script>
  <script src="folder-settings.js"></script>
</body>
</html>
