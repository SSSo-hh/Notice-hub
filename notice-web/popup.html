<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>공지 모음 수집기</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <div class="logo"><span class="logo-mark">N</span>공지 모음 수집기</div>
  </header>

  <!-- 수집 -->
  <section class="block">
    <div class="row">
      <div>
        <div class="label">마지막 수집</div>
        <div id="last-collect" class="value">불러오는 중...</div>
      </div>
      <!-- ⑪단계에서 연결합니다 -->
      <button id="collect-now" class="btn btn-primary" disabled title="⑪단계에서 연결합니다">지금 수집</button>
    </div>
  </section>

  <!-- 게시판 추가 -->
  <section class="block">
    <!-- ⑦단계에서 연결합니다 -->
    <button id="add-board" class="btn btn-block" disabled title="⑦단계에서 연결합니다">이 페이지를 게시판으로 추가</button>
  </section>

  <!-- 규칙 미설정 게시판 -->
  <section class="block">
    <div class="label">규칙 미설정 게시판 <span id="norule-count" class="count"></span></div>
    <ul id="norule-list" class="list"></ul>
  </section>

  <footer class="foot">
    <button id="open-website" class="btn btn-block">웹사이트 열기</button>
  </footer>

  <!-- 팝업은 일반 웹페이지처럼 script 태그로 불러옵니다 (확장 폴더 안의 파일만 가능) -->
  <script src="supabase.js"></script>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
